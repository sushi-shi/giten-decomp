# units.toml - the per-translation-unit build manifest (single source of truth).
#
# PURE DATA - no prose. The compile-flag evidence lives in docs/compiler-flags.md;
# this file is machine-edited in bulk, so comments here both rot and get eaten by
# sweeps.
#
# [build]  global toolchain config, passed through to the objdiff scratch block.
# [flags]  named profiles; every [[unit]] picks one by name. A profile is the FULL
#          flag set - there are no per-unit bolt-ons (`extra` is rejected).
#            c         the game's C: /Ox /ML (no /Gf pooling, no /Gy; static LIBC.LIB).
#            cpp       C++ in the Windows platform layer: /Ox /Ob0 /Zp1 /ML /GX (no RTTI).
#            cpp-noeh  C++ without /GX, for a TU with zero EH frames.
# [[unit]] unit (stem; must match symbol_names.csv's unit column), source, flags.
#
# Add a TU: add an [[unit]] block, then `giten build` (the generator edge re-emits
# build.ninja).

[build]
compiler = "msvc5.0"
platform = "win32"

[flags]
c        = ["/nologo", "/c", "/Ox", "/Zp1", "/ML"]
cpp      = ["/nologo", "/c", "/Ox", "/Ob0", "/Zp1", "/ML", "/GX"]
cpp-noeh = ["/nologo", "/c", "/Ox", "/Ob0", "/Zp1", "/ML"]

